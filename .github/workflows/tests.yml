name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -p 'test_*.py' -v
  native-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb xauth
      - name: Validate native layouts and navigation
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/check_desktop_ui.py --output "$RUNNER_TEMP/coding-hub-ui"
      - name: Validate saved sidebar on cold startup
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/check_startup_ui.py
